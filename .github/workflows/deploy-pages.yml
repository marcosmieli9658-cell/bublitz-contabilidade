name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Evitar indexação da cópia de prévia
        run: node -e "const fs=require('fs');const p='dist-pages/index.html';const h=fs.readFileSync(p,'utf8').replace(/<meta name=\"robots\"[^>]*>/,'<meta name=\"robots\" content=\"noindex, nofollow\" />').replace(/<meta name=\"googlebot\"[^>]*>/,'<meta name=\"googlebot\" content=\"noindex, nofollow\" />');fs.writeFileSync(p,h)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
